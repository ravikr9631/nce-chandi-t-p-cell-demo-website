<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Registration | Nalanda College of Engineering, Chandi</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --secondary: #0f172a;
    --accent: #f59e0b;
    --bg-light: #f8fafc;
    --surface: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --radius: 12px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.85) 0%, rgba(30, 41, 59, 0.9) 100%),
                url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80') center/cover no-repeat fixed;
    color: var(--text-main);
}

/* Glassmorphism Container */
.container {
    width: 100%;
    max-width: 480px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    padding: 2.5rem 2rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow-xl);
    border: 1px solid rgba(255, 255, 255, 0.3);
    text-align: center;
}

/* Header & Logo */
.brand-header {
    margin-bottom: 1.75rem;
}

.brand-header img {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    object-fit: cover;
    margin-bottom: 0.75rem;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}

.brand-header h1 {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--secondary);
    line-height: 1.3;
}

.brand-header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.25rem;
}

.page-title {
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.page-title i {
    color: var(--primary);
}

/* Form Styles */
.form-group {
    margin-bottom: 1rem;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 0.825rem;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 0.35rem;
}

.input-wrapper {
    position: relative;
}

.input-wrapper i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.95rem;
}

input, select {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text-main);
    background-color: var(--surface);
    outline: none;
    transition: var(--transition);
}

select {
    appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2064748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 1rem center;
    background-size: 1em;
}

input:focus, select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.75rem;
}

/* Primary Button */
.btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.btn-submit:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}

/* Links & Footer */
.links {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.875rem;
    color: var(--text-muted);
}

.links a {
    text-decoration: none;
    color: var(--primary);
    font-weight: 700;
    transition: var(--transition);
}

.links a:hover {
    text-decoration: underline;
    color: var(--primary-hover);
}

.back-home {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    margin-top: 1rem;
    font-size: 0.825rem;
    color: var(--text-muted);
    text-decoration: none;
}

.back-home:hover {
    color: var(--secondary);
}
</style>
</head>

<body>

<div class="container">

    <!-- College Branding -->
    <div class="brand-header">
        <img src="logo.jpg" alt="NCE Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/68?text=NCE';">
        <h1>Nalanda College of Engineering</h1>
        <p>Training & Placement Cell • Chandi</p>
    </div>

    <div class="page-title">
        <i class="fa-solid fa-user-graduate"></i> Student Registration
    </div>

    <form id="signupForm" onsubmit="handleSignup(event)">
        <!-- Full Name -->
        <div class="form-group">
            <label for="fullName">Full Name</label>
            <div class="input-wrapper">
                <i class="fa-regular fa-user"></i>
                <input type="text" id="fullName" placeholder="e.g. Rahul Kumar" required>
            </div>
        </div>

        <!-- Official Email -->
        <div class="form-group">
            <label for="email">Email Address</label>
            <div class="input-wrapper">
                <i class="fa-regular fa-envelope"></i>
                <input type="email" id="email" placeholder="student@ncechandi.ac.in" required>
            </div>
        </div>

        <!-- Roll Number & Batch Row -->
        <div class="form-row">
            <div class="form-group">
                <label for="rollNo">College Roll No.</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-id-card"></i>
                    <input type="text" id="rollNo" placeholder="e.g. 2110512" required>
                </div>
            </div>

            <div class="form-group">
                <label for="passoutBatch">Passout Batch</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-calendar"></i>
                    <select id="passoutBatch" required>
                        <option value="">Year</option>
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                        <option value="2026">2026</option>
                        <option value="2027">2027</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Branch Selection (NCE Branches) -->
        <div class="form-group">
            <label for="branch">Engineering Department</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-graduation-cap"></i>
                <select id="branch" required>
                    <option value="">Select Branch</option>
                    <option value="CSE">Computer Science & Engineering</option>
                    <option value="CE">Civil Engineering</option>
                    <option value="EEE">Electrical & Electronics Engineering</option>
                    <option value="ME">Mechanical Engineering</option>
                    <option value="Aero">Aeronautical Engineering</option>
                </select>
            </div>
        </div>

        <!-- Passwords Row -->
        <div class="form-row">
            <div class="form-group">
                <label for="password">Create Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock"></i>
                    <input type="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-shield-halved"></i>
                    <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="6">
                </div>
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-user-plus"></i> Register Account
        </button>
    </form>

    <div class="links">
        <p>Already registered? <a href="student.html">Login here</a></p>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Back to Main Portal</a>
    </div>

</div>

<script>
function handleSignup(event) {
    event.preventDefault();

    const password = document.getElementById("password").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const name = document.getElementById("fullName").value;

    if (password !== confirmPassword) {
        alert("Passwords do not match. Please check and try again.");
        return;
    }

    // Demo success flow
    alert("Registration Successful!\nWelcome " + name + " to Nalanda College of Engineering, Chandi T&P Portal.");
    window.location.href = "student.html";
}
</script>

</body>
</html>
