<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Portal Login | Nalanda College of Engineering, Chandi</title>

<!-- Google Fonts & Font Awesome Icons -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --secondary: #0f172a;
    --accent: #f59e0b;
    --bg-light: #f8fafc;
    --surface: #ffffff;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --shadow-xl: 0 20px 25px -5px rgb(0 0 0 / 0.1), 0 8px 10px -6px rgb(0 0 0 / 0.1);
    --radius: 12px;
    --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Plus Jakarta Sans', sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2.5rem 1rem;
    background: linear-gradient(135deg, rgba(15, 23, 42, 0.88) 0%, rgba(30, 41, 59, 0.92) 100%),
                url('https://images.unsplash.com/photo-1523240795612-9a054b0db644?auto=format&fit=crop&q=80') center/cover no-repeat fixed;
    color: var(--text-main);
}

/* Glassmorphism Container */
.container {
    width: 100%;
    max-width: 440px;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(12px);
    padding: 2.5rem 2rem;
    border-radius: var(--radius);
    box-shadow: var(--shadow-xl);
    border: 1px solid rgba(255, 255, 255, 0.3);
    text-align: center;
}

/* Header & Logo */
.brand-header {
    margin-bottom: 1.5rem;
}

.brand-header img {
    width: 68px;
    height: 68px;
    border-radius: 50%;
    border: 3px solid var(--accent);
    object-fit: cover;
    margin-bottom: 0.75rem;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}

.brand-header h1 {
    font-size: 1.15rem;
    font-weight: 800;
    color: var(--secondary);
    line-height: 1.3;
}

.brand-header p {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-top: 0.25rem;
}

.page-title {
    font-size: 1.35rem;
    font-weight: 800;
    color: var(--secondary);
    margin-bottom: 1.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.page-title i {
    color: var(--primary);
}

/* Form Styles */
.form-group {
    margin-bottom: 1.25rem;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 0.825rem;
    font-weight: 700;
    color: var(--secondary);
    margin-bottom: 0.35rem;
}

.input-wrapper {
    position: relative;
}

.input-wrapper i {
    position: absolute;
    left: 1rem;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 0.95rem;
}

input {
    width: 100%;
    padding: 0.75rem 1rem 0.75rem 2.75rem;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 0.9rem;
    color: var(--text-main);
    background-color: var(--surface);
    outline: none;
    transition: var(--transition);
}

input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
}

/* Primary Button */
.btn-submit {
    width: 100%;
    padding: 0.85rem;
    background: var(--secondary);
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 700;
    cursor: pointer;
    transition: var(--transition);
    margin-top: 0.5rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
}

.btn-submit:hover {
    background: #1e293b;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.25);
}

/* Links & Footer */
.links {
    margin-top: 1.5rem;
    padding-top: 1.25rem;
    border-top: 1px solid var(--border);
    font-size: 0.875rem;
    color: var(--text-muted);
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.links a {
    text-decoration: none;
    color: var(--primary);
    font-weight: 700;
    transition: var(--transition);
}

.links a:hover {
    text-decoration: underline;
    color: var(--primary-hover);
}

.back-home {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    margin-top: 0.75rem;
    font-size: 0.825rem;
    color: var(--text-muted);
    text-decoration: none;
}

.back-home:hover {
    color: var(--secondary);
}
</style>
</head>

<body>

<div class="container">

    <!-- College Branding -->
    <div class="brand-header">
        <img src="logo.jpg" alt="NCE Logo" onerror="this.onerror=null; this.src='https://via.placeholder.com/68?text=NCE';">
        <h1>Nalanda College of Engineering</h1>
        <p>Training & Placement Cell • Chandi</p>
    </div>

    <div class="page-title">
        <i class="fa-solid fa-user-graduate"></i> Student Portal Login
    </div>

    <form id="studentLoginForm" onsubmit="handleLogin(event)">
        <!-- Roll Number / Username -->
        <div class="form-group">
            <label for="studentId">University Roll No. / Registration ID</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-id-card"></i>
                <input type="text" id="studentId" placeholder="e.g. 21105123001" required>
            </div>
        </div>

        <!-- Password -->
        <div class="form-group">
            <label for="password">Password</label>
            <div class="input-wrapper">
                <i class="fa-solid fa-lock"></i>
                <input type="password" id="password" placeholder="••••••••" required minlength="6">
            </div>
        </div>

        <button type="submit" class="btn-submit">
            <i class="fa-solid fa-right-to-bracket"></i> Authenticate & Login
        </button>
    </form>

    <div class="links">
        <p><a href="javascript:void(0)" onclick="forgotPassword()">Forgot Password?</a></p>
        <p>New Student Candidate? <a href="signup.html">Register Account</a></p>
        <a href="index.html" class="back-home"><i class="fa-solid fa-arrow-left"></i> Return to Main Portal</a>
    </div>

</div>

<script>
function handleLogin(event) {
    event.preventDefault();
    const studentId = document.getElementById("studentId").value;
    alert("Student Authentication Successful!\nWelcome back, Roll No: " + studentId);
}

function forgotPassword() {
    alert("Password Reset Request Submitted.\nPlease check your registered student email address or contact the T&P Cell Administrator.");
}
</script>

</body>
</html>
